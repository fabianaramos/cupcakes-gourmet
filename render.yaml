databases:
  - name: cupcakes-db
    plan: free
    databaseName: cupcakes
    user: cupcakes

services:
  - type: web
    name: cupcakes-gourmet
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cupcakes-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 0
